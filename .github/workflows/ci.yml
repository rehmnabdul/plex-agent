name: ci

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore PlexAgent.sln

      - name: Build
        run: dotnet build PlexAgent.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PlexAgent.sln --configuration Release --no-build --filter "FullyQualifiedName!~IntegrationTests"

      - name: Pack
        run: dotnet pack src/PlexAgent/PlexAgent.csproj --configuration Release --no-build -o artifacts
