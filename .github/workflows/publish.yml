name: publish

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore PlexAgent.sln

      - name: Build
        run: dotnet build PlexAgent.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PlexAgent.sln --configuration Release --no-build --filter "FullyQualifiedName!~IntegrationTests"

      - name: Pack
        run: |
          mkdir -p artifacts
          dotnet pack src/PlexAgent/PlexAgent.csproj --configuration Release --no-build -o artifacts
          dotnet pack src/PlexAgent.Providers.OpenAI/PlexAgent.Providers.OpenAI.csproj --configuration Release --no-build -o artifacts
          dotnet pack src/PlexAgent.Providers.Anthropic/PlexAgent.Providers.Anthropic.csproj --configuration Release --no-build -o artifacts
          dotnet pack src/PlexAgent.Providers.Gemini/PlexAgent.Providers.Gemini.csproj --configuration Release --no-build -o artifacts

      - name: Push to NuGet.org
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not configured; skipping push."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
